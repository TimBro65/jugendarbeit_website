
<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Kalender – Jugendarbeit Lutherkirche</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="background"></div>


    <!-- Navigation -->
    <header class="navbar">

        <div class="nav-container">

            <a href="index.html" class="logo-link">
                <img src="logo.png" alt="Logo Jugendarbeit" class="logo">
            </a>

            <nav class="nav-menu">
                <a href="index.html">Startseite</a>
                <a href="neues.html">Neues</a>
                <a href="kalender.html" class="active">Kalender</a>
                <a href="programme.html">Programme</a>
                <a href="kontakt.html">Kontakt</a>
            </nav>

        </div>

    </header>


    <main class="page-container">

        <section class="page-header glass-card">

            <p class="small-title">TERMINE</p>

            <h1>Unser <span>Kalender</span></h1>

            <p>
                Hier findest du alle kommenden Jugendtreffs,
                Aktionen und Veranstaltungen.
            </p>

        </section>


        <!-- Kalender -->

        <section class="calendar-section">

            <div class="calendar-controls glass-card">

                <button id="previous-month">
                    ←
                </button>

                <h2 id="calendar-month">
                    Kalender
                </h2>

                <button id="next-month">
                    →
                </button>

            </div>


            <div id="calendar-container" class="calendar-grid">

                <div class="loading glass-card">
                    Kalender wird geladen ...
                </div>

            </div>


            <div class="calendar-events">

                <h2>Kommende Termine</h2>

                <div id="events-container">

                    <div class="loading glass-card">
                        Termine werden geladen ...
                    </div>

                </div>

            </div>

        </section>

    </main>


    <footer>

        <div class="footer-content">

            <img src="logo.png" alt="Jugendarbeit Logo" class="footer-logo">

            <p>Jugendarbeit Lutherkirche</p>

            <p class="copyright">
                © 2026 Jugendarbeit Lutherkirche
            </p>

        </div>

    </footer>


    <script src="script.js"></script>

</body>
</html>
